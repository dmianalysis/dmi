name: Deploy Web Dashboard

# ROUND-3 REPAIR (§2/§3). This workflow no longer maintains an
# independent ad-hoc staging recipe. It delegates staging to the single
# deployment builder (`scripts.prepare_deployment`) — the same builder
# used by `deploy_production.yml` and by the monthly preparation
# workflow's local validation step — and then rsyncs a scoped subset of
# the built tree (dashboard shell + release manifests + release notes)
# for the paths that specifically trigger this workflow.
#
# It runs only after a reviewed change to `main` (or an explicitly
# authorized manual dispatch). Manual dispatch defaults to dry-run.
# Strict SSH host verification is required (§3); ssh-keyscan failure is
# fatal.

on:
  push:
    branches: [ main ]
    paths:
      - 'web/dashboard.html'
      - 'web/dashboard/.htaccess'
      - 'web/health.json'
      - 'data/outputs/releases.json'
      - 'data/outputs/latest.json'
      - 'data/outputs/releases/*.html'
  workflow_dispatch:
    inputs:
      production:
        description: >-
          Set to true to actually rsync to the live site. Default false
          is a dry-run: staging is built and validated locally, nothing
          is uploaded.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.9'

jobs:
  deploy-web-dashboard:
    runs-on: ubuntu-latest

    steps:
      # §2: check out the exact triggering commit; do not hardcode ref.
      - name: Checkout triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve production flag
        id: mode
        env:
          INPUT_PRODUCTION: ${{ github.event.inputs.production }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            PROD="true"
          else
            PROD="${INPUT_PRODUCTION:-false}"
          fi
          case "$PROD" in
            true) PROD="true" ;;
            *)    PROD="false" ;;
          esac
          echo "production=$PROD" >> "$GITHUB_OUTPUT"

      - name: Build staging via central builder
        run: |
          # §2: reuse the single deployment builder. This guarantees
          # the dashboard workflow ships exactly the same file bytes
          # (with the same closure guarantees) as the full deploy
          # workflow.
          python -m scripts.prepare_deployment --output-dir deploy --verify

      - name: Guard against Core artifacts in staged tree
        run: |
          set +e
          MATCHES=$(find deploy -type f \( -iname '*_core.*' -o -iname '*-core.*' \) 2>/dev/null)
          set -e
          if [ -n "$MATCHES" ]; then
            echo "Core artifacts staged; refusing to deploy:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Guard against Core spec_urls in manifests
        run: |
          python <<'PY'
          import json, sys
          from pathlib import Path
          failed = 0
          for name in ("releases.json", "latest.json"):
              p = Path("deploy/data/outputs") / name
              manifest = json.loads(p.read_text())
              for entry in manifest.get("releases", []):
                  if "core" in entry.get("spec_urls", {}):
                      print(f"{name}: release {entry.get('release_id')} still advertises Core spec_urls")
                      failed += 1
          sys.exit(1 if failed else 0)
          PY

      - name: Skip remote deployment (dry-run)
        if: steps.mode.outputs.production != 'true'
        run: |
          echo "Dry-run: skipping SSH setup and rsync. Staging is at ./deploy/."

      - name: Setup SSH key (strict host verification)
        if: steps.mode.outputs.production == 'true'
        env:
          IFASTNET_SSH_HOST: ${{ secrets.IFASTNET_SSH_HOST }}
          IFASTNET_SSH_KEY: ${{ secrets.IFASTNET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$IFASTNET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # §3: ssh-keyscan MUST succeed. No `|| true`.
          ssh-keyscan -p 1394 "$IFASTNET_SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy dashboard shell to iFastNet (strict host verification)
        if: steps.mode.outputs.production == 'true'
        env:
          IFASTNET_SSH_USER: ${{ secrets.IFASTNET_SSH_USER }}
          IFASTNET_SSH_HOST: ${{ secrets.IFASTNET_SSH_HOST }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p 1394 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          rsync -avz --progress -e "$SSH_CMD" \
            ./deploy/dashboard.html \
            "$IFASTNET_SSH_USER@$IFASTNET_SSH_HOST:/home/agiraces/dmianalysis/dashboard.html"

          $SSH_CMD "$IFASTNET_SSH_USER@$IFASTNET_SSH_HOST" \
            'mkdir -p /home/agiraces/dmianalysis/dashboard /home/agiraces/dmianalysis/data/outputs/releases'

          rsync -avz --progress -e "$SSH_CMD" \
            ./deploy/dashboard/.htaccess \
            "$IFASTNET_SSH_USER@$IFASTNET_SSH_HOST:/home/agiraces/dmianalysis/dashboard/.htaccess"

          rsync -avz --progress -e "$SSH_CMD" \
            ./deploy/health.json \
            "$IFASTNET_SSH_USER@$IFASTNET_SSH_HOST:/home/agiraces/dmianalysis/health.json"

          rsync -avz --progress -e "$SSH_CMD" \
            ./deploy/data/outputs/releases.json \
            ./deploy/data/outputs/latest.json \
            "$IFASTNET_SSH_USER@$IFASTNET_SSH_HOST:/home/agiraces/dmianalysis/data/outputs/"

          rsync -avz --progress -e "$SSH_CMD" \
            ./deploy/data/outputs/releases/ \
            "$IFASTNET_SSH_USER@$IFASTNET_SSH_HOST:/home/agiraces/dmianalysis/data/outputs/releases/"

      - name: Deployment summary
        run: |
          if [ "${{ steps.mode.outputs.production }}" = "true" ]; then
            echo "Web dashboard deployment complete."
          else
            echo "Dry-run complete (nothing deployed)."
          fi
          echo "  https://dmianalysis.org/dashboard.html"
          echo "  https://dmianalysis.org/health.json"
          echo "  https://dmianalysis.org/data/outputs/releases.json"
          echo "  https://dmianalysis.org/data/outputs/latest.json"
