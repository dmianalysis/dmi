name: Deploy Web Dashboard

on:
  push:
    branches: [ main ]
    paths:
      - 'web/dashboard.html'
      - 'web/dashboard/.htaccess'
      - 'web/health.json'
      - 'data/outputs/releases.json'
      - 'data/outputs/latest.json'
      - 'data/outputs/releases/*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-web-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Prepare dashboard deployment package
        run: |
          echo "Preparing web dashboard deployment package..."

          mkdir -p deploy/dashboard

          if [ ! -f "web/dashboard.html" ]; then
            echo "web/dashboard.html not found in repository"
            exit 1
          fi
          cp web/dashboard.html deploy/dashboard.html

          if [ ! -f "web/dashboard/.htaccess" ]; then
            echo "web/dashboard/.htaccess not found in repository"
            exit 1
          fi
          cp web/dashboard/.htaccess deploy/dashboard/.htaccess

          if [ ! -f "web/health.json" ]; then
            echo "web/health.json not found in repository"
            exit 1
          fi
          cp web/health.json deploy/health.json

          mkdir -p deploy/data/outputs/releases
          if [ ! -f "data/outputs/releases.json" ]; then
            echo "data/outputs/releases.json not found in repository"
            exit 1
          fi
          cp data/outputs/releases.json deploy/data/outputs/releases.json

          if [ ! -f "data/outputs/latest.json" ]; then
            echo "data/outputs/latest.json not found in repository"
            exit 1
          fi
          cp data/outputs/latest.json deploy/data/outputs/latest.json

          if ! compgen -G "data/outputs/releases/*.html" > /dev/null; then
            echo "No release-note HTML files found in repository"
            exit 1
          fi
          cp data/outputs/releases/*.html deploy/data/outputs/releases/

          echo "Dashboard deployment contents:"
          find deploy -type f

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.IFASTNET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 1394 ${{ secrets.IFASTNET_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy dashboard to iFastNet via rsync
        run: |
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/deploy_key -p 1394 -o StrictHostKeyChecking=no" \
            ./deploy/dashboard.html \
            ${{ secrets.IFASTNET_SSH_USER }}@${{ secrets.IFASTNET_SSH_HOST }}:/home/agiraces/dmianalysis/dashboard.html

      - name: Ensure deployment directories exist on iFastNet
        run: |
          ssh -i ~/.ssh/deploy_key -p 1394 -o StrictHostKeyChecking=no \
            ${{ secrets.IFASTNET_SSH_USER }}@${{ secrets.IFASTNET_SSH_HOST }} \
            'mkdir -p /home/agiraces/dmianalysis/dashboard /home/agiraces/dmianalysis/data/outputs/releases'

      - name: Deploy /dashboard/.htaccess redirect to iFastNet via rsync
        run: |
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/deploy_key -p 1394 -o StrictHostKeyChecking=no" \
            ./deploy/dashboard/.htaccess \
            ${{ secrets.IFASTNET_SSH_USER }}@${{ secrets.IFASTNET_SSH_HOST }}:/home/agiraces/dmianalysis/dashboard/.htaccess

      - name: Deploy health.json to iFastNet via rsync
        run: |
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/deploy_key -p 1394 -o StrictHostKeyChecking=no" \
            ./deploy/health.json \
            ${{ secrets.IFASTNET_SSH_USER }}@${{ secrets.IFASTNET_SSH_HOST }}:/home/agiraces/dmianalysis/health.json

      - name: Deploy release manifests to iFastNet via rsync
        run: |
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/deploy_key -p 1394 -o StrictHostKeyChecking=no" \
            ./deploy/data/outputs/releases.json \
            ./deploy/data/outputs/latest.json \
            ${{ secrets.IFASTNET_SSH_USER }}@${{ secrets.IFASTNET_SSH_HOST }}:/home/agiraces/dmianalysis/data/outputs/

      - name: Deploy release notes to iFastNet via rsync
        run: |
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/deploy_key -p 1394 -o StrictHostKeyChecking=no" \
            ./deploy/data/outputs/releases/ \
            ${{ secrets.IFASTNET_SSH_USER }}@${{ secrets.IFASTNET_SSH_HOST }}:/home/agiraces/dmianalysis/data/outputs/releases/

      - name: Deployment summary
        run: |
          echo "Web dashboard deployment complete."
          echo "  Files deployed:"
          echo "    web/dashboard.html         -> /home/agiraces/dmianalysis/dashboard.html"
          echo "    web/dashboard/.htaccess    -> /home/agiraces/dmianalysis/dashboard/.htaccess"
          echo "    web/health.json            -> /home/agiraces/dmianalysis/health.json"
          echo "    data/outputs/releases.json -> /home/agiraces/dmianalysis/data/outputs/releases.json"
          echo "    data/outputs/latest.json   -> /home/agiraces/dmianalysis/data/outputs/latest.json"
          echo "    data/outputs/releases/*.html -> /home/agiraces/dmianalysis/data/outputs/releases/"
          echo "  Site:"
          echo "    https://dmianalysis.org/dashboard.html (canonical)"
          echo "    https://dmianalysis.org/dashboard/     (301 -> /dashboard.html)"
          echo "    https://dmianalysis.org/health.json"
          echo "    https://dmianalysis.org/data/outputs/releases.json"
          echo "    https://dmianalysis.org/data/outputs/latest.json"
