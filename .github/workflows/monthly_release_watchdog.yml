# Missing-release watchdog (monitoring only — never prepares, merges or deploys).
#
# The release-gate reminder follows release PRs that exist. This workflow
# catches the case it cannot see: the monthly preparation run on the 15th
# never started, failed before opening a PR, or succeeded without one.
# It derives the expected reference period from the date, reads the
# GitHub evidence and opens or updates one Issue per period when a human
# needs to act. See docs/deployment-workflows.md, "Missing-release
# watchdog".
#
# It has no secrets beyond the job token, which can read Actions, PRs and
# contents and write Issues. scripts.monthly_release_watchdog refuses
# every write except creating an Issue or commenting on one.
#
# It runs on the runner image's python3 with the standard library only,
# and never uses actions/setup-python or requirements-lock/: the monthly
# workflow's Python setup is one of the things it watches.
# tests/test_python_runtime_policy.py holds it to that.

name: DMI Missing-Release Watchdog

on:
  schedule:
    # Daily from the 17th to the 28th, two days after monthly_dmi.yml.
    - cron: '37 16 17-28 * *'
  workflow_dispatch:
    inputs:
      as_of:
        description: >-
          Evaluation date (YYYY-MM-DD, UTC) to replay a past cycle. Leave
          blank for today. A replayed date is always a dry run.
        required: false
        default: ''
      notify:
        description: >-
          Create or update the GitHub Issue. Off by default: a manual run
          only prints its findings to the run summary.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: monthly-release-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show runner Python
        run: |
          # The runner image's own python3, on purpose. The watchdog uses
          # only the standard library, so it does not depend on
          # actions/setup-python or the DMI dependency lock: a failure
          # there is one of the things it reports.
          python3 --version

      - name: Check this month's release preparation
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AS_OF: ${{ github.event.inputs.as_of }}
          INPUT_NOTIFY: ${{ github.event.inputs.notify }}
        run: |
          # Scheduled runs notify. Manual runs are dry runs unless notify
          # is ticked, and a replayed date is always a dry run.
          ARGS=()
          if [ "$EVENT_NAME" = "schedule" ]; then
            ARGS+=(--notify)
          elif [ -n "$INPUT_AS_OF" ]; then
            ARGS+=(--as-of "$INPUT_AS_OF" --dry-run)
          elif [ "$INPUT_NOTIFY" = "true" ]; then
            ARGS+=(--notify)
          else
            ARGS+=(--dry-run)
          fi
          python3 -m scripts.monthly_release_watchdog "${ARGS[@]}"
