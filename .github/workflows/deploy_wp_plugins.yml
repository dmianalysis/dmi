name: Deploy Custom WordPress Plugins

# ROUND-3 REPAIR (§2/§3). Deploys the custom WP plugins only after a
# reviewed change lands on `main`, from the triggering commit. Manual
# dispatch defaults to dry-run. Strict SSH host verification is
# required; ssh-keyscan failure is fatal.

on:
  push:
    branches: [ main ]
    paths:
      - 'web/wp-plugins/dmi-latest-info/**'
      - 'web/wp-plugins/dmi-release-data/**'
  workflow_dispatch:
    inputs:
      production:
        description: >-
          Set to true to actually rsync plugins to the live site.
          Default false is a dry-run.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  deploy-wp-plugins:
    runs-on: ubuntu-latest

    steps:
      # §2: use the triggering commit; never hardcode ref: main.
      - name: Checkout triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve production flag
        id: mode
        env:
          INPUT_PRODUCTION: ${{ github.event.inputs.production }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            PROD="true"
          else
            PROD="${INPUT_PRODUCTION:-false}"
          fi
          case "$PROD" in
            true) PROD="true" ;;
            *)    PROD="false" ;;
          esac
          echo "production=$PROD" >> "$GITHUB_OUTPUT"

      - name: Prepare plugin deployment package
        run: |
          mkdir -p deploy/wp-content/plugins
          for plugin in dmi-latest-info dmi-release-data; do
            if [ -d "web/wp-plugins/$plugin" ]; then
              mkdir -p "deploy/wp-content/plugins/$plugin"
              rsync -a \
                --exclude=".git/" \
                --exclude=".github/" \
                --exclude=".DS_Store" \
                --exclude="node_modules/" \
                --exclude="tests/" \
                --exclude="test/" \
                --exclude="__pycache__/" \
                "web/wp-plugins/$plugin/" \
                "deploy/wp-content/plugins/$plugin/"
            fi
          done
          if ! find deploy/wp-content/plugins -type f | grep -q .; then
            echo "No plugin files were staged for deployment"
            exit 1
          fi
          find deploy/wp-content/plugins -type f | sed -n '1,120p'

      - name: Guard against Core references in staged plugins
        run: |
          set +e
          MATCHES=$(grep -RInE "['\"]core['\"]|_core\.json|-core\.(json|csv|parquet)" \
            deploy/wp-content/plugins 2>/dev/null)
          set -e
          if [ -n "$MATCHES" ]; then
            echo "Core references detected in staged plugin source; refusing to deploy:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Skip remote deployment (dry-run)
        if: steps.mode.outputs.production != 'true'
        run: |
          echo "Dry-run: skipping SSH setup and rsync. Staging is at ./deploy/."

      - name: Setup SSH key (strict host verification)
        if: steps.mode.outputs.production == 'true'
        env:
          IFASTNET_SSH_HOST: ${{ secrets.IFASTNET_SSH_HOST }}
          IFASTNET_SSH_KEY: ${{ secrets.IFASTNET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$IFASTNET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # §3: ssh-keyscan MUST succeed. No `|| true`.
          ssh-keyscan -p 1394 "$IFASTNET_SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy plugins to iFastNet (strict host verification)
        if: steps.mode.outputs.production == 'true'
        env:
          IFASTNET_SSH_USER: ${{ secrets.IFASTNET_SSH_USER }}
          IFASTNET_SSH_HOST: ${{ secrets.IFASTNET_SSH_HOST }}
        run: |
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/deploy_key -p 1394 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            ./deploy/wp-content/plugins/ \
            "$IFASTNET_SSH_USER@$IFASTNET_SSH_HOST:/home/agiraces/dmianalysis/wp-content/plugins/"

      - name: Deployment summary
        run: |
          if [ "${{ steps.mode.outputs.production }}" = "true" ]; then
            echo "WordPress plugin deployment complete."
          else
            echo "Dry-run complete (nothing deployed)."
          fi
          echo "  Plugins: dmi-latest-info, dmi-release-data"
          echo "  Target:  /home/agiraces/dmianalysis/wp-content/plugins/"
