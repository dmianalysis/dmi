name: Deploy Custom WordPress Plugins

# Sequencing constraint (Phase 5 / audit §7.3):
# This workflow auto-fires on any push to `main` touching a plugin's source
# tree. It must land in the same merge commit as the manifest changes that the
# plugin renders, so the live site never shows a plugin that disagrees with
# the deployed manifests. A dry-run path is provided for manual repair
# validation via `workflow_dispatch`.

on:
  push:
    branches: [ main ]
    paths:
      - 'web/wp-plugins/dmi-latest-info/**'
      - 'web/wp-plugins/dmi-release-data/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'When true, skip SSH/rsync. Use for repair validation.'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  deploy-wp-plugins:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve dry-run flag
        id: mode
        run: |
          DRY_RUN='${{ github.event.inputs.dry_run }}'
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN='false'
          fi
          case "$DRY_RUN" in
            true|True|TRUE|1) DRY_RUN='true' ;;
            *) DRY_RUN='false' ;;
          esac
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Dry-run mode: $DRY_RUN"

      - name: Prepare plugin deployment package
        run: |
          echo "📦 Preparing WordPress custom plugin deployment package..."

          mkdir -p deploy/wp-content/plugins

          for plugin in dmi-latest-info dmi-release-data; do
            if [ -d "web/wp-plugins/$plugin" ]; then
              mkdir -p "deploy/wp-content/plugins/$plugin"
              rsync -a \
                --exclude=".git/" \
                --exclude=".github/" \
                --exclude=".DS_Store" \
                --exclude="node_modules/" \
                --exclude="tests/" \
                --exclude="test/" \
                --exclude="__pycache__/" \
                "web/wp-plugins/$plugin/" \
                "deploy/wp-content/plugins/$plugin/"
            fi
          done

          if ! find deploy/wp-content/plugins -type f | grep -q .; then
            echo "❌ No plugin files were staged for deployment"
            exit 1
          fi

          echo "📁 Plugin deployment contents:"
          find deploy/wp-content/plugins -type f | sed -n '1,120p'

      - name: Guard against Core references in staged plugins
        run: |
          # Defense-in-depth (Phase 5 requirement): fail if any staged plugin
          # source still references the withdrawn Core specification. Detects
          # references to a `core` spec key or `_core.json` artifact URL.
          set +e
          MATCHES=$(grep -RInE "['\"]core['\"]|_core\.json|-core\.(json|csv|parquet)" \
            deploy/wp-content/plugins 2>/dev/null)
          set -e
          if [ -n "$MATCHES" ]; then
            echo "❌ Core references detected in staged plugin source — refusing to deploy:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No Core references in staged plugin source."

      - name: Skip remote deployment (dry-run mode)
        if: steps.mode.outputs.dry_run == 'true'
        run: |
          echo "🏜  Dry-run mode: skipping SSH key setup and rsync."
          echo "    Deploy tree exists at ./deploy/ for local inspection."

      - name: Setup SSH key
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.IFASTNET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 1394 ${{ secrets.IFASTNET_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy plugins to iFastNet via rsync
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/deploy_key -p 1394 -o StrictHostKeyChecking=no" \
            ./deploy/wp-content/plugins/ \
            ${{ secrets.IFASTNET_SSH_USER }}@${{ secrets.IFASTNET_SSH_HOST }}:/home/agiraces/dmianalysis/wp-content/plugins/

      - name: Deployment summary
        run: |
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            echo "🏜 Dry-run summary (nothing deployed):"
          else
            echo "🚀 WordPress plugin deployment complete!"
          fi
          echo "   Plugins deployed:"
          echo "   - dmi-latest-info"
          echo "   - dmi-release-data"
          echo "   Target: /home/agiraces/dmianalysis/wp-content/plugins/"
          echo "   Site:   https://dmianalysis.org/"
