# Monthly DMI Computation (release preparation only — never deploys).
#
# ROUND-3 REPAIR (§1). This workflow is now scoped strictly to release
# PREPARATION. It computes, QAs, generates manifests + release notes,
# builds and validates a deployment candidate locally, and (in
# prepare_release mode) opens a review PR. It NEVER:
#
#   - configures SSH keys,
#   - runs rsync/sftp/ssh against the live site,
#   - auto-merges a PR,
#   - performs any production write.
#
# Actual production deployment happens in a separate, post-merge
# workflow (.github/workflows/deploy_production.yml) that is triggered
# only by an authorized push to `main` or an explicit production
# workflow_dispatch. See docs/deployment-workflows.md.
#
# Two-spec pipeline (v0.1.12): Baseline (U-3, headline CPI) + Slack-Plus
# (U-6, headline CPI). Core is intended/unimplemented and withdrawn; see
# docs/repair/CORE_WITHDRAWAL.md.

name: Monthly DMI Preparation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          Execution mode. `validate` runs offline against committed
          fixtures/artifacts and is safe (no secrets required, no PR
          opened). `prepare_release` runs the full monthly pipeline
          against live BLS data and opens a review PR. Neither mode
          deploys.
        required: false
        default: 'validate'
        type: choice
        options:
          - validate
          - prepare_release
      data_source:
        description: >-
          Data source. `fixture` uses committed artifacts already in
          the repository and never touches the network. `live` fetches
          from the BLS API and requires production secrets. `fixture`
          is only compatible with `mode=validate`.
        required: false
        default: 'fixture'
        type: choice
        options:
          - fixture
          - live
      reference_period:
        description: >-
          Reference period (YYYY-MM). Leave blank on scheduled runs and
          on validate/fixture runs; the workflow resolves the correct
          period automatically.
        required: false
        default: ''

  schedule:
    # 17 minutes past the hour on the 15th of every month (after CPI release,
    # off the top-of-hour Actions congestion). Scheduled runs use
    # prepare_release + live data; a human must still review and merge the PR.
    - cron: '17 10 15 * *'

env:
  PYTHON_VERSION: '3.9'

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-dmi:
    runs-on: ubuntu-latest

    steps:
      # §1: use the default checkout behavior. Scheduled runs execute
      # against the default branch (main); manual dispatch executes
      # against the branch the operator selected in the Actions UI (which
      # may be a repair branch); release-preparation runs from their
      # triggering ref. `ref: main` is intentionally NOT hardcoded.
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve run mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_DATA_SOURCE: ${{ github.event.inputs.data_source }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Scheduled runs always execute prepare_release + live data.
          # Manual runs default to validate + fixture (safe/offline).
          if [ "$EVENT_NAME" = "schedule" ]; then
            MODE="prepare_release"
            DATA_SOURCE="live"
          else
            MODE="${INPUT_MODE:-validate}"
            DATA_SOURCE="${INPUT_DATA_SOURCE:-fixture}"
          fi

          case "$MODE" in
            validate|prepare_release) ;;
            *) echo "ERROR: unknown mode '$MODE'"; exit 1 ;;
          esac
          case "$DATA_SOURCE" in
            fixture|live) ;;
            *) echo "ERROR: unknown data_source '$DATA_SOURCE'"; exit 1 ;;
          esac

          if [ "$DATA_SOURCE" = "live" ] && [ "$MODE" = "validate" ]; then
            echo "ERROR: data_source=live requires mode=prepare_release."
            echo "  validate mode is offline and must not touch the BLS API."
            exit 1
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "data_source=$DATA_SOURCE" >> "$GITHUB_OUTPUT"
          echo "Resolved: mode=$MODE, data_source=$DATA_SOURCE"

      - name: Resolve reference period
        id: period
        env:
          INPUT_PERIOD: ${{ github.event.inputs.reference_period }}
          DATA_SOURCE: ${{ steps.mode.outputs.data_source }}
        run: |
          if [ -n "$INPUT_PERIOD" ]; then
            PERIOD="$INPUT_PERIOD"
          elif [ "$DATA_SOURCE" = "fixture" ]; then
            # In fixture/offline mode, use the period already advertised
            # by the committed latest.json. Never fabricates a period.
            PERIOD=$(python -c "import json; print(json.load(open('data/outputs/latest.json'))['releases'][0]['release_id'])")
          else
            PERIOD="$(date -u -d 'last month' '+%Y-%m')"
          fi
          if ! [[ "$PERIOD" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "ERROR: resolved reference period '$PERIOD' is not YYYY-MM."
            exit 1
          fi
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "Reference period: $PERIOD"

      # -------- LIVE-ONLY steps: skipped entirely in fixture/validate mode --------

      - name: Fetch CPI data (live only)
        if: steps.mode.outputs.data_source == 'live'
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          echo "Fetching CPI data for ${{ steps.period.outputs.period }}..."
          python -m scripts.test_bls_api

      - name: Compute DMI Baseline (live only)
        if: steps.mode.outputs.data_source == 'live'
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          PERIOD_YEAR=$(echo "${{ steps.period.outputs.period }}" | cut -d'-' -f1)
          WEIGHTS_YEAR=$(python -c "import json; print(json.load(open('data/curated/weights_by_group_latest.json'))['weights_year'])")
          echo "WEIGHTS_YEAR=$WEIGHTS_YEAR" >> $GITHUB_ENV
          echo "Computing baseline DMI for ${{ steps.period.outputs.period }}..."
          python -m scripts.compute_dmi_release ${{ steps.period.outputs.period }} --spec baseline --weights-year "$WEIGHTS_YEAR"

      - name: Compute DMI Slack+ (live only)
        if: steps.mode.outputs.data_source == 'live'
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          echo "Computing slack-plus DMI for ${{ steps.period.outputs.period }}..."
          python -m scripts.compute_dmi_release ${{ steps.period.outputs.period }} --spec slack_plus --weights-year "$WEIGHTS_YEAR"

      - name: Build specifications manifest (live only)
        if: steps.mode.outputs.data_source == 'live'
        run: |
          python -m scripts.build_specifications_manifest ${{ steps.period.outputs.period }}

      - name: Generate release note (live only)
        if: steps.mode.outputs.data_source == 'live'
        run: |
          python -m scripts.compute_dmi_release ${{ steps.period.outputs.period }} --release-note-only

      - name: Update timeseries (live only)
        if: steps.mode.outputs.data_source == 'live'
        run: |
          python -m scripts.update_timeseries ${{ steps.period.outputs.period }}

      # -------- Validation gates: run in every mode against on-disk artifacts --------

      - name: Guard against stale specifications.json
        run: |
          PERIOD="${{ steps.period.outputs.period }}"
          SPEC_PERIOD=$(python -c "import json; print(json.load(open('data/outputs/specifications.json'))['reference_period'])")
          if [ "$SPEC_PERIOD" != "$PERIOD" ]; then
            echo "specifications.json reference_period is '$SPEC_PERIOD'; expected '$PERIOD'."
            exit 1
          fi

      - name: Validate release artifacts against schemas
        run: |
          PERIOD="${{ steps.period.outputs.period }}"
          PERIOD="$PERIOD" python <<'PY'
          import json, os, sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          SCHEMAS = Path("schemas")
          OUT = Path("data/outputs")
          period = os.environ["PERIOD"]

          targets = [
              (SCHEMAS / "dmi_output.schema.json", OUT / f"dmi_release_{period}.json"),
              (SCHEMAS / "dmi_output.schema.json", OUT / f"dmi_release_{period}_slack_plus.json"),
              (SCHEMAS / "releases.schema.json",   OUT / "releases.json"),
              (SCHEMAS / "releases.schema.json",   OUT / "latest.json"),
              (SCHEMAS / "specifications.schema.json", OUT / "specifications.json"),
          ]
          failed = 0
          for schema_path, instance_path in targets:
              schema = json.loads(schema_path.read_text())
              Draft202012Validator.check_schema(schema)
              validator = Draft202012Validator(schema)
              instance = json.loads(instance_path.read_text())
              errors = sorted(validator.iter_errors(instance), key=lambda e: list(e.absolute_path))
              if errors:
                  print(f"FAIL {instance_path.name} vs {schema_path.name}:")
                  for err in errors:
                      print(f"   path={list(err.absolute_path)}: {err.message}")
                  failed += 1
              else:
                  print(f"OK   {instance_path.name} vs {schema_path.name}")
          sys.exit(1 if failed else 0)
          PY

      - name: Sanity-check release manifest vs raw release
        run: |
          PERIOD="${{ steps.period.outputs.period }}" python <<'PY'
          import json, os, sys
          from pathlib import Path
          period = os.environ["PERIOD"]
          raw = json.loads(Path(f"data/outputs/dmi_release_{period}.json").read_text())
          raw_summary = raw["summary_metrics"]
          raw_metrics = {
              "dmi_median": raw_summary["dmi_median"],
              "dmi_stress": raw_summary["dmi_stress"],
              "income_pressure_spread": raw_summary["income_pressure_spread"],
              "income_pressure_tilt": raw_summary["income_pressure_tilt"],
              "most_pressured_group": raw_summary["most_pressured_group"],
              "least_pressured_group": raw_summary["least_pressured_group"],
              "unemployment": raw["dmi_by_group"][0]["slack"],
          }
          if raw_metrics["income_pressure_spread"] < 0:
              print("ERROR: negative spread"); sys.exit(1)
          def check(mp, label):
              m = json.loads(Path(mp).read_text())
              entries = [r for r in m["releases"] if r["release_id"] == period]
              if not entries:
                  print(f"ERROR: {label} missing entry for {period}"); return 1
              em = entries[0]["metrics"]; errs = 0
              for k, raw_v in raw_metrics.items():
                  mv = em.get(k)
                  if isinstance(raw_v, str):
                      if mv != raw_v:
                          print(f"ERROR {label} {k}: {mv!r} vs {raw_v!r}"); errs += 1
                  else:
                      if abs(float(mv) - float(raw_v)) > 1e-6:
                          print(f"ERROR {label} {k}: {mv} vs {raw_v}"); errs += 1
              return errs
          errs = check("data/outputs/releases.json", "releases.json")
          errs += check("data/outputs/latest.json", "latest.json")
          sys.exit(1 if errs else 0)
          PY

      - name: Build local deployment candidate (never deployed here)
        run: |
          # §4/§5: builds and verifies the deployment tree LOCALLY inside
          # the runner. Nothing here talks to the live site.
          python -m scripts.prepare_deployment --output-dir deploy --verify

      - name: Show deployment candidate summary
        run: |
          echo "Deployment candidate files:"
          find deploy -type f | wc -l
          find deploy -type f | sed -n '1,80p'

      # -------- PR creation: prepare_release mode only, no auto-merge --------

      - name: Ensure workflow files are not included in release PR
        if: steps.mode.outputs.mode == 'prepare_release'
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows || true

      - name: Create Release PR (no deployment)
        id: create-pr
        if: steps.mode.outputs.mode == 'prepare_release'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Add DMI release for ${{ steps.period.outputs.period }}

            - Baseline (U-3, headline CPI) computed
            - Slack-Plus (U-6, headline CPI) computed
            - QA passed
            - Deployment candidate built and verified locally
            - NOT DEPLOYED
          branch: release/${{ steps.period.outputs.period }}
          branch-suffix: timestamp
          title: 'DMI Release: ${{ steps.period.outputs.period }} (not deployed)'
          body: |
            ## DMI Release for ${{ steps.period.outputs.period }}

            Automated monthly preparation (two-spec pipeline: Baseline +
            Slack-Plus). This PR contains the computed artifacts and a
            locally verified deployment candidate.

            **This PR does NOT deploy to the live site.** Deployment is
            performed by a separate post-merge workflow
            (`deploy_production.yml`) after this PR is reviewed and
            merged to `main`.

            ### Artifacts
            - `data/outputs/dmi_release_${{ steps.period.outputs.period }}.json`
            - `data/outputs/dmi_release_${{ steps.period.outputs.period }}_slack_plus.json`
            - `data/outputs/qa_report_${{ steps.period.outputs.period }}_baseline.json`
            - `data/outputs/qa_report_${{ steps.period.outputs.period }}_slack_plus.json`
            - `data/outputs/specifications.json`
            - `data/outputs/releases.json`
            - `data/outputs/latest.json`
            - `data/outputs/releases/${{ steps.period.outputs.period }}.html`

            ### Reviewer checklist
            - [ ] Baseline vs Slack-Plus values reasonable.
            - [ ] QA warnings (weights vintage etc.) triaged.
            - [ ] `deploy/` tree in the workflow log lists all expected
                  endpoints (releases, latest, specifications, health,
                  timeseries, raw baseline + slack_plus).
            - [ ] No Core, `_u6`, or `_with_ci` artifacts staged.
            - [ ] Merge only after independent review. **This PR is
                  never auto-merged.**

            After merge, the post-merge deployment workflow will rebuild
            staging from the merged commit and push to iFastNet under
            its own gates.

          labels: |
            automated
            release
            not-deployed
          add-paths: |
            data/outputs/
            data/outputs/published/
            web/health.json
            deploy/

      # §1: NO deploy steps, NO ssh-keyscan, NO rsync, NO auto-merge.
      # Deployment lives in .github/workflows/deploy_production.yml.
