# NOTE: Any file deployed from deploy/ but maintained elsewhere **MUST** be
# refreshed into deploy/ during the deployment workflow.
#
# Two-spec pipeline (v0.1.12): Baseline (U-3, headline CPI) + Slack-Plus (U-6,
# headline CPI). Core has been withdrawn; see docs/repair/CORE_WITHDRAWAL.md.
#
# Safety posture (§6): the workflow is DRY-RUN BY DEFAULT.
#   - Scheduled runs (cron) always run as dry-run: they compute, QA, build the
#     manifest, generate the release note, assemble the deploy tree via
#     scripts/prepare_deployment.py, and then STOP. No SSH key setup, no
#     rsync, no PR creation.
#   - Manual runs (workflow_dispatch) also default to dry-run. To actually
#     publish, an operator must trigger the workflow manually and set
#     `dry_run=false` explicitly. There is no auto-merge; the PR that opens
#     is intentionally left for human review.
# This defeats the "accidental deploy on schedule" and "auto-merge without
# review" failure modes documented in the repair spec.

name: Monthly DMI Computation

on:
  workflow_dispatch:
    inputs:
      reference_period:
        description: 'Reference period (YYYY-MM). Leave blank on scheduled runs; the workflow will use the prior calendar month.'
        required: false
        default: ''
      dry_run:
        description: 'DRY-RUN BY DEFAULT. Leave true to compute + stage + open PR without deploying. Set false explicitly to publish (rsync + PR, no auto-merge).'
        required: false
        default: 'true'

  schedule:
    # Run on the 15th after CPI release, but avoid top-of-hour GitHub Actions congestion.
    # Scheduled runs always run as dry-run; see the safety posture note above.
    - cron: '17 10 15 * *'

env:
  PYTHON_VERSION: '3.9'

permissions:
  contents: write
  pull-requests: write

jobs:
  compute-dmi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve reference period
        id: period
        run: |
          # Manual runs may supply an explicit period; scheduled runs (and manual
          # runs that leave the field blank) fall back to the prior calendar
          # month deterministically.
          INPUT_PERIOD='${{ github.event.inputs.reference_period }}'
          if [ -n "$INPUT_PERIOD" ]; then
            PERIOD="$INPUT_PERIOD"
            echo "Using explicit manual reference period: $PERIOD"
          else
            PERIOD="$(date -u -d 'last month' '+%Y-%m')"
            echo "Using prior calendar month (UTC) as reference period: $PERIOD"
          fi

          # Validate YYYY-MM shape early so downstream steps fail cleanly.
          if ! [[ "$PERIOD" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "ERROR: resolved reference period '$PERIOD' is not YYYY-MM."
            exit 1
          fi

          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Resolve dry-run flag
        id: mode
        run: |
          DRY_RUN='${{ github.event.inputs.dry_run }}'
          # Safety default (§6): if no input is provided (scheduled runs, or a
          # manual dispatch that left the field unset), fall through to
          # dry-run. Publishing requires an explicit `dry_run=false` on a
          # workflow_dispatch trigger.
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN='true'
          fi
          case "$DRY_RUN" in
            false|False|FALSE|0) DRY_RUN='false' ;;
            *)                    DRY_RUN='true'  ;;
          esac
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Dry-run mode: $DRY_RUN"

      - name: Fetch CPI data
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          echo "Fetching CPI data for ${{ steps.period.outputs.period }}..."
          python -m scripts.test_bls_api

      - name: Check CE weights status
        run: |
          PERIOD_YEAR=$(echo "${{ steps.period.outputs.period }}" | cut -d'-' -f1)
          WEIGHTS_YEAR=$(python -c "import json; print(json.load(open('data/curated/weights_by_group_latest.json'))['weights_year'])")

          echo "Period year: $PERIOD_YEAR"
          echo "Current weights year: $WEIGHTS_YEAR"

          if [ $((PERIOD_YEAR - WEIGHTS_YEAR)) -gt 2 ]; then
            echo "⚠️ WARNING: Weights are $((PERIOD_YEAR - WEIGHTS_YEAR)) years old"
            echo "Consider updating CE weights"
          fi
          echo "WEIGHTS_YEAR=$WEIGHTS_YEAR" >> $GITHUB_ENV

      - name: Compute DMI Baseline
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          echo "Computing baseline DMI for ${{ steps.period.outputs.period }}..."
          python -m scripts.compute_dmi_release ${{ steps.period.outputs.period }} --spec baseline --weights-year "$WEIGHTS_YEAR"

          test -f data/outputs/dmi_release_${{ steps.period.outputs.period }}.json
          test -f data/outputs/latest.json
          test -f data/outputs/releases.json

      - name: Compute DMI Slack+
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          echo "Computing slack-plus DMI for ${{ steps.period.outputs.period }}..."
          python -m scripts.compute_dmi_release ${{ steps.period.outputs.period }} --spec slack_plus --weights-year "$WEIGHTS_YEAR"
          test -f data/outputs/dmi_release_${{ steps.period.outputs.period }}_slack_plus.json

      - name: Build specifications manifest (post-Baseline+Slack-Plus)
        run: |
          # Build the two-spec manifest ONLY after both spec runs have succeeded.
          python -m scripts.build_specifications_manifest ${{ steps.period.outputs.period }}
          test -f data/outputs/specifications.json

      - name: Guard against stale specifications.json
        run: |
          # A stale specifications.json for a different reference period is a
          # hard failure: it means the manifest writer silently no-op'd or a
          # previous run left the wrong artifact on disk.
          PERIOD="${{ steps.period.outputs.period }}"
          SPEC_PERIOD=$(python -c "import json; print(json.load(open('data/outputs/specifications.json'))['reference_period'])")
          if [ "$SPEC_PERIOD" != "$PERIOD" ]; then
            echo "❌ specifications.json reference_period is '$SPEC_PERIOD'; expected '$PERIOD'."
            exit 1
          fi
          echo "✅ specifications.json reference_period matches ($PERIOD)."

      - name: Generate deferred baseline release note
        run: |
          # Note is generated AFTER both spec runs so the note's robustness
          # section reflects the actual two-spec results.
          echo "Generating release note after all specifications are available..."
          python -m scripts.compute_dmi_release ${{ steps.period.outputs.period }} --release-note-only
          test -f data/outputs/releases/${{ steps.period.outputs.period }}.html

      - name: Update timeseries
        run: |
          echo "Appending ${{ steps.period.outputs.period }} to timeseries..."
          python -m scripts.update_timeseries ${{ steps.period.outputs.period }}

      - name: Run QA validation
        run: |
          echo "QA validation..."

          QA_STATUS_BASELINE=$(python -c "import json; print(json.load(open('data/outputs/qa_report_${{ steps.period.outputs.period }}_baseline.json'))['status'])")
          QA_STATUS_SLACK_PLUS=$(python -c "import json; print(json.load(open('data/outputs/qa_report_${{ steps.period.outputs.period }}_slack_plus.json'))['status'])")

          if [ "$QA_STATUS_BASELINE" != "PASS" ] && [ "$QA_STATUS_BASELINE" != "PASS_WITH_WARNING" ]; then
            echo "❌ QA validation failed (baseline): $QA_STATUS_BASELINE"
            exit 1
          fi

          if [ "$QA_STATUS_SLACK_PLUS" != "PASS" ] && [ "$QA_STATUS_SLACK_PLUS" != "PASS_WITH_WARNING" ]; then
            echo "❌ QA validation failed (slack_plus): $QA_STATUS_SLACK_PLUS"
            exit 1
          fi

          echo "✅ QA validation (baseline): $QA_STATUS_BASELINE, (slack_plus): $QA_STATUS_SLACK_PLUS"

      - name: Validate release artifacts against schemas
        run: |
          # Fail the run if the just-generated artifacts do not validate against
          # the committed JSON schemas. This closes the historical loophole
          # where writers drifted from schemas.
          PERIOD="${{ steps.period.outputs.period }}"
          python <<PY
          import json, sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          SCHEMAS = Path("schemas")
          OUT = Path("data/outputs")
          period = "${{ steps.period.outputs.period }}"

          targets = [
              (SCHEMAS / "dmi_output.schema.json", OUT / f"dmi_release_{period}.json"),
              (SCHEMAS / "dmi_output.schema.json", OUT / f"dmi_release_{period}_slack_plus.json"),
              (SCHEMAS / "releases.schema.json",   OUT / "releases.json"),
              (SCHEMAS / "releases.schema.json",   OUT / "latest.json"),
              (SCHEMAS / "specifications.schema.json", OUT / "specifications.json"),
          ]

          failed = 0
          for schema_path, instance_path in targets:
              schema = json.loads(schema_path.read_text())
              Draft202012Validator.check_schema(schema)
              validator = Draft202012Validator(schema)
              instance = json.loads(instance_path.read_text())
              errors = sorted(validator.iter_errors(instance), key=lambda e: list(e.absolute_path))
              if errors:
                  print(f"❌ {instance_path.name} fails {schema_path.name}:")
                  for err in errors:
                      print(f"   path={list(err.absolute_path)}: {err.message}")
                  failed += 1
              else:
                  print(f"✅ {instance_path.name} validates against {schema_path.name}")
          sys.exit(1 if failed else 0)
          PY

      - name: Sanity-check release manifest vs raw release
        run: |
          echo "Verifying releases.json/latest.json metrics match the raw baseline release for ${{ steps.period.outputs.period }}..."
          PERIOD="${{ steps.period.outputs.period }}" python <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          period = os.environ["PERIOD"]
          raw_path = Path(f"data/outputs/dmi_release_{period}.json")
          releases_path = Path("data/outputs/releases.json")
          latest_path = Path("data/outputs/latest.json")

          REQUIRED_METRICS = (
              "dmi_median",
              "dmi_stress",
              "income_pressure_spread",
              "income_pressure_tilt",
              "most_pressured_group",
              "least_pressured_group",
              "unemployment",
          )
          # Field names in raw summary_metrics differ for unemployment; pull that
          # one from the Q1 slack value, matching build_metrics_payload().
          NUMERIC_TOL = 1e-6

          raw = json.loads(raw_path.read_text())
          raw_summary = raw["summary_metrics"]
          raw_metrics = {
              "dmi_median": raw_summary["dmi_median"],
              "dmi_stress": raw_summary["dmi_stress"],
              "income_pressure_spread": raw_summary["income_pressure_spread"],
              "income_pressure_tilt": raw_summary["income_pressure_tilt"],
              "most_pressured_group": raw_summary["most_pressured_group"],
              "least_pressured_group": raw_summary["least_pressured_group"],
              "unemployment": raw["dmi_by_group"][0]["slack"],
          }

          # income_pressure_spread is a nonnegative range (max - min across
          # quintiles). Zero is a legitimate outcome (perfect distributional
          # equality across quintiles); only a strictly negative spread is
          # impossible and would indicate a computation bug.
          if raw_metrics["income_pressure_spread"] < 0:
              print(f"ERROR: raw income_pressure_spread is {raw_metrics['income_pressure_spread']}; must be nonnegative.")
              sys.exit(1)

          def check_manifest(manifest_path: Path, label: str) -> int:
              manifest = json.loads(manifest_path.read_text())
              entries = [r for r in manifest["releases"] if r["release_id"] == period]
              if not entries:
                  print(f"ERROR: {label} has no entry for {period}.")
                  return 1
              entry_metrics = entries[0]["metrics"]
              errs = 0
              for key in REQUIRED_METRICS:
                  if key not in entry_metrics:
                      print(f"ERROR: {label} entry {period} missing metric '{key}'.")
                      errs += 1
                      continue
                  manifest_val = entry_metrics[key]
                  raw_val = raw_metrics[key]
                  if isinstance(raw_val, str):
                      if manifest_val != raw_val:
                          print(f"ERROR: {label} entry {period} metric '{key}': manifest={manifest_val!r}, raw={raw_val!r}")
                          errs += 1
                  else:
                      if abs(float(manifest_val) - float(raw_val)) > NUMERIC_TOL:
                          print(f"ERROR: {label} entry {period} metric '{key}': manifest={manifest_val}, raw={raw_val}")
                          errs += 1
              return errs

          errs = 0
          errs += check_manifest(releases_path, "releases.json")
          errs += check_manifest(latest_path, "latest.json")

          if errs:
              print(f"❌ Sanity check failed with {errs} mismatch(es).")
              sys.exit(1)
          print("✅ Sanity check passed: manifest metrics match raw release.")
          PY

      # =========================================
      # DEPLOYMENT TO IFASTNET (THIN MONTHLY DEPLOY)
      # =========================================

      - name: Prepare deployment package
        run: |
          echo "📦 Preparing deployment package via scripts/prepare_deployment.py..."
          # §5/§6: the deploy tree is assembled by a single deterministic
          # Python script that (a) mirrors every URL advertised by the shipped
          # manifests, (b) copies the dashboard shell + health endpoint,
          # (c) excludes the historical archive (uploaded separately by the
          # optional delta step below), (d) refuses to stage any Core-named
          # artifact, and (e) verifies byte-identical parity against the
          # source files. Any drift fails the workflow here, before the
          # rsync step ever sees the tree.
          python -m scripts.prepare_deployment --output-dir deploy --verify

          echo "📁 Deployment package contents:"
          find deploy -type f | sed -n '1,80p'

      - name: Skip remote deployment (dry-run mode)
        if: steps.mode.outputs.dry_run == 'true'
        run: |
          echo "🏜  Dry-run mode: skipping SSH key setup, rsync, PR creation, and auto-merge."
          echo "    Computation, QA, manifest, note, and package assembly have completed."
          echo "    Deploy tree exists at ./deploy/ for local inspection."

      - name: Setup SSH key
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.IFASTNET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 1394 ${{ secrets.IFASTNET_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to iFastNet via rsync
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/deploy_key -p 1394 -o StrictHostKeyChecking=no" \
            ./deploy/ \
            ${{ secrets.IFASTNET_SSH_USER }}@${{ secrets.IFASTNET_SSH_HOST }}:/home/agiraces/dmianalysis/

      - name: Deploy new historical file only (optional)
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          PERIOD="${{ steps.period.outputs.period }}"
          HIST_LOCAL="data/outputs/published/historical/dmi_release_${PERIOD}.json"
          HIST_REMOTE="/home/agiraces/dmianalysis/data/outputs/published/historical/"

          if [ -f "$HIST_LOCAL" ]; then
            echo "📦 Uploading historical delta: $HIST_LOCAL"
            rsync -avz \
              -e "ssh -i ~/.ssh/deploy_key -p 1394 -o StrictHostKeyChecking=no" \
              "$HIST_LOCAL" \
              ${{ secrets.IFASTNET_SSH_USER }}@${{ secrets.IFASTNET_SSH_HOST }}:"$HIST_REMOTE"
          else
            echo "ℹ️ No historical delta found for ${PERIOD}; skipping."
          fi

      - name: Deployment summary
        run: |
          PERIOD="${{ steps.period.outputs.period }}"
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            echo "🏜 Dry-run summary (nothing deployed):"
          else
            echo "🚀 Deployment complete!"
          fi
          echo "   Dashboard:            https://dmianalysis.org/dashboard.html"
          echo "   Health:               https://dmianalysis.org/health.json"
          echo "   Data (baseline):      https://dmianalysis.org/data/outputs/dmi_release_${PERIOD}.json"
          echo "   Data (slack_plus):    https://dmianalysis.org/data/outputs/dmi_release_${PERIOD}_slack_plus.json"


      - name: Ensure workflow files are not included in release PR
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows || true

      - name: Create Pull Request
        id: create-pr
        if: steps.mode.outputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Add DMI release for ${{ steps.period.outputs.period }}

            - DMI computed for all quintiles
            - Baseline (U-3, headline CPI) spec generated
            - Slack-Plus (U-6, headline CPI) spec generated
            - QA validation passed
          branch: release/${{ steps.period.outputs.period }}
          branch-suffix: timestamp
          title: 'DMI Release: ${{ steps.period.outputs.period }}'
          body: |
            ## DMI Release for ${{ steps.period.outputs.period }}

            **Automated monthly computation** (two-spec pipeline: Baseline + Slack-Plus)

            ### Summary
            - **Reference Period**: ${{ steps.period.outputs.period }}
            - **DMI Results (baseline)**: `data/outputs/dmi_release_${{ steps.period.outputs.period }}.json`
            - **DMI Results (slack_plus)**: `data/outputs/dmi_release_${{ steps.period.outputs.period }}_slack_plus.json`
            - **QA (baseline)**: `data/outputs/qa_report_${{ steps.period.outputs.period }}_baseline.json`
            - **QA (slack_plus)**: `data/outputs/qa_report_${{ steps.period.outputs.period }}_slack_plus.json`

            ### Files Changed
            - `data/outputs/dmi_release_${{ steps.period.outputs.period }}.json`
            - `data/outputs/dmi_release_${{ steps.period.outputs.period }}_slack_plus.json`
            - `data/outputs/qa_report_${{ steps.period.outputs.period }}_baseline.json`
            - `data/outputs/qa_report_${{ steps.period.outputs.period }}_slack_plus.json`
            - `data/outputs/specifications.json`
            - `data/outputs/releases.json`
            - `data/outputs/latest.json`
            - `data/outputs/releases/${{ steps.period.outputs.period }}.html`

            ### Next Steps (manual review required)
            1. Review baseline vs slack_plus for reasonableness
            2. Check QA warnings (especially weights vintage)
            3. Verify the deploy tree (workflow logs) shows the expected
               URL set and byte-identical parity
            4. Approve and merge manually — **this PR is not auto-merged**
               (see repair spec §6)

            > **Site was updated by this run's rsync step**: dmianalysis.org
            > now serves data for ${{ steps.period.outputs.period }}. Merging
            > this PR promotes the same artifacts into `main` so the next
            > run has an identical starting point.

            ---
            *This PR was automatically created by the Monthly DMI workflow. It
            is intentionally NOT auto-merged; a human reviewer must approve
            and merge it.*

          labels: |
            automated
            release
          add-paths: |
            data/outputs/
            data/outputs/published/
            web/health.json

      # §6: No auto-merge step. The PR opened above is intentionally left
      # open for a human reviewer to inspect the diff, verify the deploy
      # logs, and merge (or close) manually.
