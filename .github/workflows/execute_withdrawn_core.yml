name: Execute Core Withdrawal (DESTRUCTIVE — Phase 2)

# Phase 2 of the Core withdrawal: deletion of 21 reviewed remote files.
#
# This is the only workflow in the repository that destroys data. It is
# built so that the single decision a dispatcher makes is "run the
# reviewed operation, yes or no" — there is no other lever. The inventory
# path, its file hash, its internal seal, the file count, the remote base
# and the subcommand are all constants in this file. None of them can be
# influenced by an input.
#
# Order of operations, each a hard gate on the next:
#
#   1. refuse to run from any ref but refs/heads/main
#   2. refuse unless the typed confirmation is exact
#   3. verify the committed inventory offline — identity, seal, scope,
#      shape — BEFORE any key is installed or any socket opened
#   4. install the pinned key and pinned host material
#   5. back up exactly the 21 inventoried files and verify every byte
#   6. upload the backup, and require that upload to have succeeded
#   7. only then: execute --confirm against the sealed inventory
#   8. verify absence, verify the operational surface survived
#
# The backup gate is not decoration. If step 5 or 6 fails, step 7 does
# not run, because a deletion whose backup failed is unrecoverable.
#
# Merging the PR that adds this file does nothing. It has no push,
# pull_request, schedule or workflow_call trigger.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: >-
          Type exactly: WITHDRAW-CORE-21-3812991FA2ED52E4
          (this authorizes the single reviewed operation and selects
          nothing — it cannot change paths, commands, or the inventory)
        required: true
        type: string

# Read-only. This workflow deletes remote files; it must never be able to
# alter the repository.
permissions:
  contents: read

# Never two deletions at once, and never cancel one midway: an
# interrupted deletion is exactly the partial state this design exists to
# avoid.
concurrency:
  group: core-withdrawal-execute
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.9'
  # The reviewed operation, pinned. Changing any of these constants means
  # a different operation, which requires a new review.
  INVENTORY_PATH: docs/repair/inventories/core-withdrawal-2026-08-19.json
  EXPECTED_FILE_SHA256: ce1e55939c2c10c04c18cb96b2457db802241f9bdfcdf484438f5250ba84e11c
  EXPECTED_INTEGRITY_SHA256: 3812991fa2ed52e4e3cfcc543c28c3f1769c20a3033c307abdb8085fd1887fd6
  EXPECTED_COUNT: '21'
  EXPECTED_REMOTE_BASE: /home/agiraces/dmianalysis
  CONFIRMATION_PHRASE: WITHDRAW-CORE-21-3812991FA2ED52E4

jobs:
  execute-withdrawal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Naming an environment does NOT by itself require a reviewer. The
    # `core-withdrawal` environment must be configured in repository
    # settings with a required reviewer before this workflow is
    # dispatched; see the PR body.
    environment: core-withdrawal

    steps:
      - name: Refuse to run from any ref but main
        run: |
          # A destructive operation must run from the reviewed code, not
          # from a branch someone can push to.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: this workflow may only run from refs/heads/main."
            echo "  got: $GITHUB_REF"
            exit 1
          fi
          echo "Ref check passed: $GITHUB_REF"

      - name: Require the exact confirmation phrase
        env:
          SUPPLIED: ${{ github.event.inputs.confirmation }}
        run: |
          if [ "$SUPPLIED" != "$CONFIRMATION_PHRASE" ]; then
            echo "ERROR: confirmation phrase does not match."
            echo "  This operation deletes 21 remote files and requires"
            echo "  the exact phrase shown in the dispatch form."
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: refs/heads/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------- gate 3: offline verification, before any credential ----

      - name: Verify the sealed inventory (offline, before any SSH)
        run: |
          # Checks identity (file sha256), integrity (seal recomputes),
          # shape (count, remote base, sorted, no reseal) and scope
          # (every name a Core class; no traversal; no Baseline,
          # Slack-Plus, _u6, _with_ci, manifest, note, health, timeseries,
          # dashboard, plugin or historical path). Exits non-zero before
          # a key exists on disk.
          mkdir -p "${{ runner.temp }}/evidence"
          python -m scripts.verify_withdrawal_inventory \
            --report "${{ runner.temp }}/evidence/pre-execution-verification.json"

      - name: Confirm the pinned constants match this workflow
        run: |
          # Defence in depth: the verifier holds its own copies of these
          # constants. If the two ever disagree, the operation is not the
          # one that was reviewed.
          python - <<'PY'
          import os, sys
          from scripts import verify_withdrawal_inventory as v
          pairs = [
              ("INVENTORY_PATH", v.INVENTORY_PATH, os.environ["INVENTORY_PATH"]),
              ("file sha256", v.EXPECTED_FILE_SHA256, os.environ["EXPECTED_FILE_SHA256"]),
              ("integrity seal", v.EXPECTED_INTEGRITY_SHA256, os.environ["EXPECTED_INTEGRITY_SHA256"]),
              ("count", str(v.EXPECTED_COUNT), os.environ["EXPECTED_COUNT"]),
              ("remote base", v.EXPECTED_REMOTE_BASE, os.environ["EXPECTED_REMOTE_BASE"]),
          ]
          bad = [(n, a, b) for n, a, b in pairs if a != b]
          for name, a, b in bad:
              print(f"MISMATCH {name}: module={a!r} workflow={b!r}")
          sys.exit(1 if bad else 0)
          PY
          echo "Workflow constants agree with the verifier module."

      # ---------- gate 4: pinned credentials -----------------------------

      - name: Install deployment key via the canonical helper
        env:
          IFASTNET_SSH_KEY: ${{ secrets.IFASTNET_SSH_KEY }}
        run: |
          bash scripts/install_deploy_key.sh \
            "${{ runner.temp }}/dmi_withdrawal_key"

      - name: Install pinned host material
        env:
          IFASTNET_SSH_HOST: ${{ secrets.IFASTNET_SSH_HOST }}
          IFASTNET_KNOWN_HOSTS: ${{ secrets.IFASTNET_KNOWN_HOSTS }}
        run: |
          # Pinned, out of band, validated against host and port. Never
          # ssh-keyscan: this workflow deletes files, so it is the last
          # place that should establish trust.
          python -m scripts.install_known_hosts \
            --host "$IFASTNET_SSH_HOST" --port 1394 \
            --known-hosts "${{ runner.temp }}/dmi_known_hosts"

      # ---------- gate 5: mandatory backup -------------------------------

      - name: Back up exactly the inventoried files
        id: backup
        env:
          DMI_REMOTE_HOST: ${{ secrets.IFASTNET_SSH_HOST }}
          DMI_REMOTE_USER: ${{ secrets.IFASTNET_SSH_USER }}
          DMI_REMOTE_PORT: '1394'
          DMI_REMOTE_BASE: /home/agiraces/dmianalysis
          DMI_REMOTE_KEY: ${{ runner.temp }}/dmi_withdrawal_key
          DMI_KNOWN_HOSTS: ${{ runner.temp }}/dmi_known_hosts
        run: |
          # The remote file list comes only from the validated inventory.
          # No directory copy, no glob: `tar -T -` reads the explicit
          # path list from stdin. Every downloaded file's size and
          # sha256 must equal the inventory's, or this fails and nothing
          # is deleted.
          python -m scripts.backup_withdrawal_targets \
            --out-dir "${{ runner.temp }}/backup"
          echo "sha256=$(shasum -a 256 "${{ runner.temp }}/backup/core-withdrawal-backup.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # ---------- gate 6: the backup must be uploaded --------------------

      - name: Upload the verified backup (must succeed before deletion)
        id: upload-backup
        uses: actions/upload-artifact@v4
        with:
          name: core-withdrawal-backup
          # Two explicitly named files. No workspace, no runner-temp
          # wildcard, nothing recursive that could sweep in the key.
          path: |
            ${{ runner.temp }}/backup/core-withdrawal-backup.tar.gz
            ${{ runner.temp }}/backup/backup-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Record backup artifact identity
        run: |
          echo "artifact id     : ${{ steps.upload-backup.outputs.artifact-id }}"
          echo "artifact url    : ${{ steps.upload-backup.outputs.artifact-url }}"
          echo "artifact digest : ${{ steps.upload-backup.outputs.artifact-digest }}"
          echo "archive sha256  : ${{ steps.backup.outputs.sha256 }}"
          {
            echo '{'
            echo '  "artifact_id": "${{ steps.upload-backup.outputs.artifact-id }}",'
            echo '  "artifact_url": "${{ steps.upload-backup.outputs.artifact-url }}",'
            echo '  "artifact_digest": "${{ steps.upload-backup.outputs.artifact-digest }}",'
            echo '  "archive_sha256": "${{ steps.backup.outputs.sha256 }}"'
            echo '}'
          } > "${{ runner.temp }}/evidence/backup-artifact.json"

      - name: Assert the backup upload succeeded
        run: |
          # Explicit gate. `needs`-style ordering is implicit within a
          # job, but this makes the precondition auditable in the log.
          if [ -z "${{ steps.upload-backup.outputs.artifact-id }}" ]; then
            echo "ERROR: backup artifact was not uploaded; refusing to delete."
            exit 1
          fi
          echo "Backup uploaded. Deletion may proceed."

      # ---------- gate 7: the reviewed destructive operation -------------

      - name: Execute the reviewed withdrawal
        env:
          DMI_REMOTE_HOST: ${{ secrets.IFASTNET_SSH_HOST }}
          DMI_REMOTE_USER: ${{ secrets.IFASTNET_SSH_USER }}
          DMI_REMOTE_PORT: '1394'
          DMI_REMOTE_BASE: /home/agiraces/dmianalysis
          DMI_REMOTE_KEY: ${{ runner.temp }}/dmi_withdrawal_key
          DMI_KNOWN_HOSTS: ${{ runner.temp }}/dmi_known_hosts
        run: |
          # Exactly the reviewed command. `execute`, the fixed inventory
          # path and `--confirm` are literals. The tool re-validates the
          # seal and scope, re-hashes every remote file, aborts entirely
          # if any digest differs, deletes only those paths, and verifies
          # absence afterwards. It never re-runs `find`.
          set -o pipefail
          python -m scripts.withdraw_remote_artifacts execute \
            --inventory docs/repair/inventories/core-withdrawal-2026-08-19.json \
            --confirm 2>&1 | tee "${{ runner.temp }}/evidence/execution-log.txt"

      # ---------- gate 8: post-execution verification --------------------

      - name: Verify origin state after deletion
        if: success()
        env:
          DMI_REMOTE_HOST: ${{ secrets.IFASTNET_SSH_HOST }}
          DMI_REMOTE_USER: ${{ secrets.IFASTNET_SSH_USER }}
          DMI_REMOTE_PORT: '1394'
          DMI_REMOTE_BASE: /home/agiraces/dmianalysis
          DMI_REMOTE_KEY: ${{ runner.temp }}/dmi_withdrawal_key
          DMI_KNOWN_HOSTS: ${{ runner.temp }}/dmi_known_hosts
        run: |
          python -m scripts.verify_withdrawal_result \
            --report "${{ runner.temp }}/evidence/origin-post-check.json"

      - name: Verify the public surface (cache-busting)
        if: success()
        run: |
          # Core URLs should 404/410. If they still return 200 while the
          # origin files are gone, that is a Cloudflare cache condition,
          # recorded as such — NOT a failed deletion, and NOT a reason to
          # restore files or purge without separate authorization.
          python -m scripts.verify_public_surface \
            --report "${{ runner.temp }}/evidence/public-http-status.json" \
            --operational-report "${{ runner.temp }}/evidence/operational-surface.json"

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-withdrawal-evidence
          # Explicitly named files only. No credentials, no ssh config,
          # no known_hosts, no environment dump.
          path: |
            docs/repair/inventories/core-withdrawal-2026-08-19.json
            ${{ runner.temp }}/backup/backup-manifest.json
            ${{ runner.temp }}/evidence/pre-execution-verification.json
            ${{ runner.temp }}/evidence/backup-artifact.json
            ${{ runner.temp }}/evidence/execution-log.txt
            ${{ runner.temp }}/evidence/origin-post-check.json
            ${{ runner.temp }}/evidence/public-http-status.json
            ${{ runner.temp }}/evidence/operational-surface.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary credentials from the runner
        if: always()
        run: |
          # Runner-local only. Opens no connection and deletes nothing
          # on the remote host.
          for f in "${{ runner.temp }}/dmi_withdrawal_key" \
                   "${{ runner.temp }}/dmi_known_hosts"; do
            if [ -f "$f" ]; then
              shred -u "$f" && echo "removed $f"
            fi
          done
          echo "Runner-local credential cleanup complete."
